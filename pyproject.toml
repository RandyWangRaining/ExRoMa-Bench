[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exroma-bench"
version = "0.1.0"
description = "Extraterrestrial Rover Manipulation Benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ExRoMa-Bench contributors" }]
dependencies = [
  "h5py>=3.10",
  "modelscope-hub>=0.2,<1.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pyarrow>=15,<20",
  "PyYAML>=6.0",
  "simforge>=0.2.4,<0.3",
  "simforge-foundry>=0.3.1,<0.4",
  "typing-extensions>=4.10,<5",
  "websockets>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
exroma = "exroma_bench.cli:main"

[tool.setuptools]
package-dir = { "" = "source" }

[tool.setuptools.packages.find]
where = ["source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source"]

[tool.ruff]
line-length = 100
target-version = "py310"
