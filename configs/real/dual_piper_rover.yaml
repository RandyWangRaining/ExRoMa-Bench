schema_version: 1
robot:
  name: dual_piper_rover
  arm_driver: null
  base_driver: null
  emergency_stop: required

policy_interface:
  joint_encoding: dual_piper_compact
  robot_state_dim: 41
  action_dim: 16
  control_frequency_hz: 10
  mast_fixed: true

cameras:
  - mast
  - front_left
  - front_right

safety:
  max_joint_step_rad: 0.04
  max_base_linear_mps: 0.15
  max_base_angular_rps: 0.35
  command_timeout_s: 0.25
  require_deadman_switch: true

calibration:
  joint_offsets: null
  camera_intrinsics: null
  camera_extrinsics: null
  base_to_arm: null
